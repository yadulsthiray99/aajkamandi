# Every morning (India time): fetch yesterday's complete mandi prices + this month's egg rates,
# rebuild with the quality gate, deploy to Cloudflare, and commit the new data
# (the stored daily history is what powers the trend charts).
name: daily-update

on:
  schedule:
    # data.gov.in is sometimes unreachable for an hour or two (HTTP 521/523 via the relay),
    # so retry later in the day. Re-runs after a success just find nothing new to commit.
    - cron: "30 1 * * *"   # 07:00 IST
    - cron: "30 4 * * *"   # 10:00 IST retry
    - cron: "30 8 * * *"   # 14:00 IST last try - only this one reports a fetch failure
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest moves to Ubuntu 26 from 2026-10-19
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Check secrets are set (values are never printed)
        env:
          DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          for name in DATA_GOV_API_KEY CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name}" ]; then missing="$missing $name"; else echo "$name: set (${#name} chars name)"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error title=Missing repository secrets::Not set:$missing. Add them under Settings > Secrets and variables > Actions > Repository secrets (exact names, Secrets tab - not Variables)."
            exit 1
          fi

      - name: Fetch data (through the Cloudflare relay - data.gov.in refuses GitHub's runners)
        id: fetch
        continue-on-error: true
        env:
          DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
          FETCH_RELAY: https://aajkamandi-fetch.aajkamandi.workers.dev
        run: |
          python scripts/fetch_mandi.py --backfill 3
          python scripts/fetch_eggs.py

      - name: Fetch failed - stop here (a later scheduled run retries)
        if: steps.fetch.outcome != 'success'
        run: |
          if [ "${{ github.event.schedule }}" = "30 8 * * *" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "::error title=Data fetch failed::data.gov.in / NECC unreachable on the last daily attempt - the site keeps yesterday's data."
            exit 1
          fi
          echo "::warning title=Data fetch failed::Source unreachable; will retry at the next scheduled time."

      - name: Build with quality gate
        if: steps.fetch.outcome == 'success'
        run: |
          npm ci
          echo '[]' > src/data/holdback.json
          npm run build:gated

      - name: Deploy to Cloudflare (static assets, wrangler.jsonc)
        if: steps.fetch.outcome == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          if ! npx wrangler deploy 2>&1 | tee deploy.log; then
            # surface the real Cloudflare message in the run summary
            msg=$(grep -iE "error|code: *[0-9]+|authentication|permission|not found|forbidden" deploy.log | grep -v "^\s*at " | head -6 | tr '\n' ' ')
            echo "::error title=Cloudflare deploy failed::${msg:-see the step log}"
            exit 1
          fi

      - name: Commit new data
        if: steps.fetch.outcome == 'success'
        run: |
          git config user.name "aajkamandi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/daily data/eggs src/data
          git diff --cached --quiet || git commit -m "Daily data $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash -q || true
          git push
