# Every morning (India time): fetch yesterday's complete mandi prices + this month's egg rates,
# rebuild with the quality gate, deploy to Cloudflare Pages, and commit the new data
# (the stored daily history is what powers the trend charts).
name: daily-update

on:
  schedule:
    - cron: "30 1 * * *"   # 07:00 IST
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Fetch data
        env:
          DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
        run: |
          python scripts/fetch_mandi.py --backfill 3
          python scripts/fetch_eggs.py

      - name: Build with quality gate
        run: |
          npm ci
          echo '[]' > src/data/holdback.json
          npm run build:gated

      - name: Deploy to Cloudflare (static assets, wrangler.jsonc)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Commit new data
        run: |
          git config user.name "aajkamandi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/daily data/eggs src/data
          git diff --cached --quiet || git commit -m "Daily data $(date -u +%Y-%m-%d)"
          git push
