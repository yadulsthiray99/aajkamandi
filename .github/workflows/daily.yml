# Every morning (India time): publish yesterday's mandi prices as soon as data.gov.in has them,
# plus this month's egg rates - rebuild with the quality gate, deploy to Cloudflare, and commit
# the new data (the stored daily history is what powers the trend charts).
#
# data.gov.in publishes the previous day's complete batch around 05:00 IST, so between 04:30 and
# 07:30 IST we poll every 10 minutes with ONE cheap request ("has yesterday's data arrived or
# grown?") and only fetch + build + deploy when it has. 10:00 and 14:00 IST always do a full
# refresh (egg rates, late rows) and act as retries if the source was down earlier.
name: daily-update

on:
  schedule:
    - cron: "*/10 23 * * *"   # 04:30-05:20 IST  poll
    - cron: "*/10 0 * * *"    # 05:30-06:20 IST  poll
    - cron: "*/10 1 * * *"    # 06:30-07:20 IST  poll
    - cron: "30 4 * * *"      # 10:00 IST full refresh / retry
    - cron: "30 8 * * *"      # 14:00 IST full refresh / last try - only this one reports a failure
  workflow_dispatch: {}

permissions:
  contents: write

# never run two updates at once (a slow fetch could overlap the next poll)
concurrency:
  group: daily-update
  cancel-in-progress: false

env:
  FETCH_RELAY: https://aajkamandi-fetch.aajkamandi.workers.dev
  # full refresh (skip the "anything new?" check) at 10:00 / 14:00 IST and on manual runs
  FORCE: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '30 4 * * *' || github.event.schedule == '30 8 * * *' }}
  LAST_TRY: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '30 8 * * *' }}

jobs:
  update:
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest moves to Ubuntu 26 from 2026-10-19
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check secrets are set (values are never printed)
        env:
          DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          for name in DATA_GOV_API_KEY CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name}" ]; then missing="$missing $name"; else echo "$name: set (${#name} chars name)"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error title=Missing repository secrets::Not set:$missing. Add them under Settings > Secrets and variables > Actions > Repository secrets (exact names, Secrets tab - not Variables)."
            exit 1
          fi

      - name: Anything new on data.gov.in? (one request)
        id: check
        continue-on-error: true
        env:
          DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
        run: |
          if [ "$FORCE" = "true" ]; then echo "new=true" >> "$GITHUB_OUTPUT"; echo "Full refresh run"; exit 0; fi
          python scripts/fetch_mandi.py --check

      - name: Fetch data (through the Cloudflare relay - data.gov.in refuses GitHub's runners)
        id: fetch
        if: steps.check.outcome == 'success' && steps.check.outputs.new == 'true'
        continue-on-error: true
        env:
          DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
        run: |
          python scripts/fetch_mandi.py --backfill 3
          python scripts/fetch_eggs.py

      - name: Source unreachable - stop here (a later scheduled run retries)
        if: steps.check.outcome == 'failure' || steps.fetch.outcome == 'failure'
        run: |
          if [ "$LAST_TRY" = "true" ]; then
            echo "::error title=Data fetch failed::data.gov.in / NECC unreachable on the last daily attempt - the site keeps the previous data."
            exit 1
          fi
          echo "::warning title=Data fetch failed::Source unreachable; the next scheduled run retries."

      - uses: actions/setup-node@v5
        if: steps.fetch.outcome == 'success'
        with:
          node-version: "22"
          cache: npm

      - name: Build with quality gate
        if: steps.fetch.outcome == 'success'
        run: |
          npm ci
          echo '[]' > src/data/holdback.json
          npm run build:gated

      - name: Deploy to Cloudflare (static assets, wrangler.jsonc)
        if: steps.fetch.outcome == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          if ! npx wrangler deploy 2>&1 | tee deploy.log; then
            # surface the real Cloudflare message in the run summary
            msg=$(grep -iE "error|code: *[0-9]+|authentication|permission|not found|forbidden" deploy.log | grep -v "^\s*at " | head -6 | tr '\n' ' ')
            echo "::error title=Cloudflare deploy failed::${msg:-see the step log}"
            exit 1
          fi

      - name: Commit new data
        if: steps.fetch.outcome == 'success'
        run: |
          git config user.name "aajkamandi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/daily data/eggs src/data
          git diff --cached --quiet || git commit -m "Daily data $(TZ=Asia/Kolkata date +%Y-%m-%d\ %H:%M) IST"
          git pull --rebase --autostash -q || true
          git push
